apiVersion: 1

# Deux sources en lecture seule (rôle grafana_reader) :
#   - traces de l'API (base mlops, schéma tracing)
#   - historique des traitements Prefect (base prefect)
datasources:
  - name: Projet - Traces API
    uid: projet-traces
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana_reader
    editable: false
    isDefault: true
    version: 1
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    jsonData:
      database: mlops
      sslmode: disable
      postgresVersion: 1800
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 300

  - name: Projet - Prefect
    uid: projet-prefect
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana_reader
    editable: false
    isDefault: false
    version: 1
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    jsonData:
      database: prefect
      sslmode: disable
      postgresVersion: 1800
      timescaledb: false
      maxOpenConns: 2
      maxIdleConns: 1
      connMaxLifetime: 300
