# Stack locale du projet 5MLDE (lehenanf).
# Démarrage : docker compose up -d --wait   (personnalisation : copier .env.example en .env)
#
# Ports hôte décalés par rapport à la stack des TPs (supinfo-5mlde : 5000/4200/5432/3000) :
# les deux stacks peuvent tourner en même temps, et un client mal configuré échoue
# au lieu d'écrire silencieusement dans la base d'un TP.
name: mlde-projet

x-healthcheck: &healthcheck-defaults
  interval: 15s
  timeout: 10s
  retries: 10
  start_period: 60s

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: mlops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-5mlde-projet-postgres}"
      # Lus par infra/postgres/init/001-roles.sql (\getenv) au premier démarrage du volume.
      API_DB_PASSWORD: "${API_DB_PASSWORD:-5mlde-projet-api}"
      GRAFANA_DB_PASSWORD: "${GRAFANA_DB_PASSWORD:-5mlde-projet-grafana}"
      PREFECT_DB_PASSWORD: "${PREFECT_DB_PASSWORD:-5mlde-projet-prefect}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 utilise un sous-dossier de version sous /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d mlops"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    restart: unless-stopped
    entrypoint: ["mlflow"]
    # Backend SQLite : l'image officielle n'embarque pas de pilote PostgreSQL et un seul
    # processus écrit (1 worker) ; les artefacts sont servis par le serveur (--serve-artifacts).
    command:
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --workers
      - "1"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - "localhost:*,127.0.0.1:*,mlflow:5000"
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5050}:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"

  prefect:
    image: prefecthq/prefect:3.8.7-python3.12
    restart: unless-stopped
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    environment:
      PREFECT_HOME: /var/lib/prefect
      # Base PostgreSQL (et non SQLite comme dans les TPs) : pas de verrou d'écriture unique
      # et les runs deviennent interrogeables par Grafana (supervision des traitements).
      PREFECT_SERVER_DATABASE_CONNECTION_URL: "postgresql+asyncpg://prefect:${PREFECT_DB_PASSWORD:-5mlde-projet-prefect}@postgres:5432/prefect"
      # Adresse de l'API vue depuis le navigateur.
      PREFECT_SERVER_UI_API_URL: "http://localhost:${PREFECT_PORT:-4250}/api"
      # Adresse interne pour les commandes exécutées dans ce conteneur.
      PREFECT_API_URL: http://127.0.0.1:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      # Correctif repris du TP04 : l'image embarque SQLAlchemy 2.1.1, avec laquelle le scheduler
      # échoue (« Can't evaluate bulk DML statement ») et ne crée aucun run planifié.
      # Installé au démarrage par l'entrypoint officiel (réseau requis).
      EXTRA_PIP_PACKAGES: "sqlalchemy==2.0.44"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PREFECT_PORT:-4250}:4200"
    volumes:
      - prefect_data:/var/lib/prefect
    healthcheck:
      <<: *healthcheck-defaults
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=5)"

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      # Identifiants de démonstration pour une stack liée à localhost uniquement.
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-5mlde-projet-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Utilisé par le provisioning des datasources ($GRAFANA_DB_PASSWORD).
      GRAFANA_DB_PASSWORD: "${GRAFANA_DB_PASSWORD:-5mlde-projet-grafana}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3030}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      <<: *healthcheck-defaults
      start_period: 30s
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]

volumes:
  postgres_data:
  mlflow_data:
  prefect_data:
  grafana_data:
